    var cfg = "# /etc/nginx/conf.d/cloudflare-realip.conf\n" +
      "# https://www.cloudflare.com/ips-v4  https://www.cloudflare.com/ips-v6\n" +
      "set_real_ip_from 173.245.48.0/20;\nset_real_ip_from 103.21.244.0/22;\n# ... one line per Cloudflare range ...\n" +
      "real_ip_header CF-Connecting-IP;";
    return el("footer", null, el("h3", { text: T.notes }), el("ul", null,
      el("li", { text: T.note1 }), el("li", { text: T.note2 }), el("li", { text: T.note3 }),
      el("li", null, T.note4, el("pre", { text: cfg }))),
      el("div", { text: T.generatedBy + " " + DATA.tool.version + " · " + T.generated + " " + DATA.generated }));
  }

  // ---------------------------------------------------------------- page
  var app = document.getElementById("app");
  var siteNames = Object.keys(DATA.sites);
  var current = DATA.all ? "*" : siteNames[0];

  function render() {
    app.textContent = "";
    var r = current === "*" ? DATA.all : DATA.sites[current];
    var title = current === "*" ? T.allSites : current;
    app.appendChild(el("header", null, el("h1", { text: T.title + " · " + (title || "") }),
      el("div", { "class": "sub", text: r ? T.period + " " + r.period.start + " → " + r.period.end + " (" + r.period.days + " " + T.days + ") · " + T.linesParsed + " " + fmt(r.lines.parsed) + " / " + fmt(r.lines.total) : "" })));
    var filters = el("div", { "class": "filters" });
    if (siteNames.length > 1 || DATA.all) {
      var sel = el("select", { "aria-label": T.site, onchange: function (e) { current = e.target.value; render(); } });
      if (DATA.all) sel.appendChild(el("option", { value: "*", text: T.allSites }));
      siteNames.forEach(function (n) { sel.appendChild(el("option", { value: n, text: n })); });
      sel.value = current;
      filters.appendChild(el("label", { text: T.site }));
      filters.appendChild(sel);
    }
    filters.appendChild(el("button", { "class": "theme-toggle", type: "button", text: T.theme, onclick: function () {
      var root = document.documentElement, dark = root.getAttribute("data-theme") === "dark" ||
        (!root.getAttribute("data-theme") && window.matchMedia("(prefers-color-scheme: dark)").matches);
      root.setAttribute("data-theme", dark ? "light" : "dark");
      render();
    } }));
    app.appendChild(filters);
    if (!r) { app.appendChild(el("div", { "class": "empty", text: T.noData })); return; }
    append(app, [warnings(current), tiles(r), secUser(r), secTrend(r), secBots(r), secPages(r), secCoverage(r), secReferrals(r),
      current === "*" ? null : secRobots(r), secSpoof(r), footer()]);
  }
  render();
})();
</script>
</body>
</html>
